name: Method 1 - Docker Build using Run Commands

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-actions-demo:method1 .

      - name: Verify image exists
        run: docker images docker-actions-demo

      - name: Run container
        run: docker run -d -p 5000:5000 --name demo-app docker-actions-demo:method1

      - name: Test container response
        run: |
          sleep 5
          curl http://localhost:5000

      - name: Stop container
        run: docker stop demo-app
