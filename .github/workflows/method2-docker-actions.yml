name: Method 2 - Docker Build using Pre-built Actions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: docker-actions-demo:method2

      - name: Verify image
        run: |
          echo "Image ID: ${{ steps.docker_build.outputs.imageid }}"
          docker images docker-actions-demo
